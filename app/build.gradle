plugins { id 'com.android.application' }

android {
    namespace 'dev.poc.aaprojectm'
    compileSdk 36
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'dev.poc.aaprojectm'
        minSdk 29 // AudioPlaybackCapture
        targetSdk 36 // Google Play: new apps must target API 36 (from 2026-08-31)
        versionCode 2
        versionName '0.2'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
    }
    // Play upload key, only when its properties exist (kept in ~/.gradle/gradle.properties, never in the repo).
    // Without them, release builds are left unsigned and debug builds work as before.
    if (project.hasProperty('AAPM_UPLOAD_STORE_FILE')) {
        signingConfigs {
            upload {
                storeFile file(AAPM_UPLOAD_STORE_FILE)
                storePassword AAPM_UPLOAD_STORE_PASSWORD
                keyAlias AAPM_UPLOAD_KEY_ALIAS
                keyPassword AAPM_UPLOAD_KEY_PASSWORD
            }
        }
        buildTypes.release.signingConfig signingConfigs.upload
    }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
    implementation 'androidx.car.app:app:1.7.0'
    implementation 'androidx.car.app:app-projected:1.7.0'
}

// Ship license texts inside the APK (assets/licenses/), copied from the repo so they can't drift.
def noticesDir = layout.buildDirectory.dir('generated/notices')
def copyNotices = tasks.register('copyNotices', Copy) {
    from(rootProject.file('LICENSE')) { rename { 'LICENSE.txt' } }
    from(rootProject.file('THIRD_PARTY_NOTICES.md'))
    from(rootProject.file('licenses/Apache-2.0.txt'))
    from(rootProject.file('third_party/projectm/LICENSE.txt')) { rename { 'projectM-LGPL-2.1.txt' } }
    into(noticesDir.map { it.dir('licenses') })
}
android.sourceSets.main.assets.srcDir(noticesDir)
tasks.named('preBuild') { dependsOn copyNotices }
